<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- ✅ REQUIRED viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baseball Highlights</title>

    <!-- Your CSS -->
    <link rel="icon" type="image/x-icon" href="text/favicon.ico">

    <!-- ✅ Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>

   <!-- ✅ Bootstrap Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
     <div class="container-fluid">
       <a class="navbar-brand" href="#">My Site</a>
     </div>
   </nav>

    <header>
      <h1>Visible Title</h1>
    </header>

    <!-- ✅ MAIN CONTENT (Required) -->
    <main class="container mt-4">

      <!-- ✅ Blog Preview Component -->
      <section class="blog-preview">
        <h2>Latest Post</h2>
        <p>This is a short preview of your blog content.</p>
        <button class="btn btn-primary">Read More</button>
      </section>

      <!-- ✅ Card Component -->
      <section class="card-container">
        <div class="card">
          <h3>Feature One</h3>
          <p>This is a reusable card.</p>
        </div>

        <div class="card">
          <h3>Feature Two</h3>
          <p>Use cards to organize your layout.</p>
        </div>
      </section>

      <!-- ✅ Form with Labels -->
      <section>
        <h2>Contact</h2>
        <form>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name"><br>

          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email"><br><br>

          <button type="submit">Submit</button>
        </form>
      </section>

    </main>

    <footer>
      <p>&copy; <span id="year"></span> Your Name</p>

      <script>
         document.getElementById("year").textContent = new Date().getFullYear();
      </script>
    </footer>

  </body>
</html>
