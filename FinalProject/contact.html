<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link rel="stylesheet" href="style/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

 <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="#">Baseball Hub</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="contact.html">Contact</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<main class="container mt-5">

  <h1 class="mb-4">Contact</h1>

  <p class="mb-4">
    Have questions, feedback, or just want to talk baseball? Send a message below.
  </p>

  <form>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" placeholder="Your name">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" placeholder="Your email">
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="5" placeholder="Write your message..."></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Send Message</button>

  </form>

  <hr class="my-5">

  <h3>Other Ways to Reach Me</h3>

  <p>📧 Email: baseballhub@email.com</p>
  <p>📸 Instagram: @baseballhub</p>

</main>

</body>
</html>
