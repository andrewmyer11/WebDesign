<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Baseball Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Baseball Highlights</h1>

<div class="card-container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1508341591423-4347099e1f19" alt="Baseball stadium at night">
        <h2>Game Day</h2>
        <p>Feel the energy of a live baseball game.</p>
        <button>Explore</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1521417531039-7c3f0c7aafaa" alt="Baseball player swinging bat">
        <h2>Training</h2>
        <p>Practice makes perfect on the field.</p>
        <button>Explore</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b" alt="Baseball on field">
        <h2>Championship</h2>
        <p>Where the best teams compete for glory.</p>
        <button>Explore</button>
    </div>

</div>

</body>
</html>
