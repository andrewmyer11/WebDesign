<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Baseball Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Baseball Highlights</h1>

<div class="card-container">

    <div class="card">
        <img src="images/gameday.jpg" alt="Baseball stadium at night">
        <h2>Game Day</h2>
        <p>Feel the energy of a live baseball game.</p>
        <button>Explore</button>
    </div>

    <div class="card">
        <img src="images/training.jpg" alt="Baseball player pitching">
        <h2>Training</h2>
        <p>Practice makes perfect on the field.</p>
        <button>Explore</button>
    </div>

    <div class="card">
        <img src="images/championship.jpg" alt="Baseball on field">
        <h2>Championship</h2>
        <p>Where the best teams compete for glory.</p>
        <button>Explore</button>
    </div>

</div>

</body>
</html>
